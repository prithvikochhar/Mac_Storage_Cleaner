[project]
name = "mac-storage-cleaner"
version = "1.0.0"
description = "A fast, safe macOS CLI tool to reclaim disk space"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = ["macos", "storage", "cleaner", "cli", "disk-space"]
authors = [
    { name = "Prithvi Kochhar", email = "prit.kochhar@gmail.com" },
]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "click>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/prithvikochhar/Mac_Storage_Cleaner"

[project.scripts]
mac-storage-cleaner = "mac_storage_cleaner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.30.1",
]
